<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHype.online</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0a0a, #380a3a);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1.5rem;
            color: #aaaaaa;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            color: #cccccc;
            line-height: 1.5;
            max-width: 500px;
            margin: 0 auto 40px auto;
        }
        .contact-section h3 {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .social-links a img {
            width: 60px;
            height: 60px;
            transition: transform 0.3s;
        }
        .social-links a img:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="1792187713783.JPG" alt="Logo" class="logo">
        <h2>Welcome to</h2>
        <h1>PHype.online</h1>
        <p>We believe in quality, not quantity. Elevated everyday essentials & curated drops. Nationwide delivery | DM to order 📥</p>
        
        <div class="contact-section">
            <h3>Contact Us</h3>
            <div class="social-links">
                <a href="https://www.facebook.com/share/193qpdQNgv/" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook Page">
                </a>
                <a href="https://www.instagram.com/phype_1?gwpx=MWY1NWR1ODBrazQwaw==" target="_blank">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
                </a>
            </div>
        </div>
    </div>
</body>
</html>
