<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHype.online</title>
    <link rel="icon" href="1792187713783.JPG">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a0512, #180929, #0a0512);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-start;
            box-sizing: border-box;
        }
        .brand-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #fff, #b388ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .main-container {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
            text-align: left;
            box-sizing: border-box;
        }
        .hero {
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 3.5rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .bio-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #a855f7;
            padding: 20px;
            border-radius: 0 15px 15px 0;
            margin-bottom: 50px;
        }
        .bio-box h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .bio-box p {
            margin: 0;
            font-size: 1.3rem;
            line-height: 1.6;
            color: #e2e8f0;
        }
        .contact-section {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 40px;
        }
        .contact-section h3 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .social-icons {
            display: flex;
            gap: 30px;
        }
        .icon-link img {
            width: 55px;
            height: 55px;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        .icon-link img:hover {
            transform: translateY(-5px);
            filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.6));
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">PHype</div>
    </header>

    <div class="main-container">
        <div class="hero">
            <h1>PHYPE.ONLINE</h1>
        </div>

        <div class="bio-box">
            <h2>About Us</h2>
            <p>We believe in quality, not quantity. Elevated everyday essentials & curated drops. Nationwide delivery | DM to order 📥</p>
        </div>
        
        <div class="contact-section">
            <h3>Contact Us</h3>
            <div class="social-icons">
                <a href="https://www.facebook.com/share/193qpdQNgv/" target="_blank" class="icon-link">
                    <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook">
                </a>
                <a href="https://www.instagram.com/phype_1?gwpx=MWY1NWR1ODBrazQwaw==" target="_blank" class="icon-link">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
                </a>
                <a href="https://wa.me/message/6REUONJAMT6KK1" target="_blank" class="icon-link">
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
                </a>
            </div>
        </div>
    </div>

</body>
</html>
